<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cricket Clash – Tournaments</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="tournament.css">
    <script src="loader.js"></script>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="header">
    <h1 class="logo"><span>Cricket</span> <span>Clash</span></h1>
    <p class="subtitle">Your Tournaments</p>
</div>

<div class="card-container" id="tournamentList">
    <!-- tournament cards injected here -->
</div>

<!-- Bottom Controls -->
<div class="bottom-controls">
    <button class="action-btn join-btn" onclick="openJoin()">
        <span class="btn-icon">+</span>
        <span>Join Tournament</span>
    </button>
    <button class="action-btn create-btn" onclick="openCreate()">
        <span class="btn-icon">✦</span>
        <span>Create Tournament</span>
    </button>
</div>

<!-- Modal -->
<div class="modal" id="modal">
    <div class="modal-overlay" onclick="closeModal()"></div>
    <div class="modal-card">
        <div class="modal-header">
            <h2 id="modalTitle"></h2>
            <button class="modal-close" onclick="closeModal()">×</button>
        </div>

        <div class="modal-body">
            <div class="input-group">
                <label>Tournament Name</label>
                <input id="tName" placeholder="Enter tournament name">
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <input id="tPass" type="password" placeholder="Enter password">
            </div>
            
            <div class="input-group" id="moneyGroup" style="display: none;">
                <label>Starting Money</label>
                <input id="tMoney" placeholder="Enter amount" type="number">
            </div>
        </div>

        <div class="modal-actions">
            <button class="modal-btn cancel-btn" onclick="closeModal()">Cancel</button>
            <button class="modal-btn submit-btn" onclick="submitModal()">Submit</button>
        </div>
    </div>
</div>

<script src="tournament.js"></script>
</body>
</html>
