<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cricket Clash - Strategy Arena</title>

<style>
/* ================= ROOT ================= */
:root {
    --bg-color: #0f1214;
    --card-bg: rgba(255, 255, 255, 0.03);
    --border-default: rgba(255, 255, 255, 0.1);
    --border-active: #4caf50;
    --text-main: #ffffff;
    --text-muted: #717171;
    --accent-blue: #3498db;
    --accent-green: #2ecc71;
}

/* ================= GLOBAL ================= */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}

body {
    background: radial-gradient(circle at center, #1a1f24 0%, #0a0c0d 100%);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
}

/* ================= LOADER ================= */
#pageLoader {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, #11161a 0%, #050607 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 99999;
}

#pageLoader .loader-text {
    font-size: clamp(2.8rem, 9vw, 4.5rem);
    font-weight: 900;
    letter-spacing: 6px;
    background: linear-gradient(90deg, #3ab5f0, #2ecc71);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: glow 1.6s ease-in-out infinite alternate;
}

@keyframes glow {
    from { opacity: 0.6; transform: scale(1); }
    to { opacity: 1; transform: scale(1.05); }
}

/* ================= NAME POPUP ================= */
#namePopup {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 99998;
}

.popup-box {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border-default);
    backdrop-filter: blur(12px);
    padding: 30px;
    border-radius: 16px;
    width: 90%;
    max-width: 360px;
    text-align: center;
}

.popup-box h2 {
    margin-bottom: 10px;
    background: linear-gradient(to right, #3ab5f0, #2ecc71);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.popup-box p {
    color: var(--text-muted);
    font-size: 0.9rem;
    margin-bottom: 20px;
}

.popup-box input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border-default);
    background: rgba(0,0,0,0.4);
    color: white;
    outline: none;
    margin-bottom: 15px;
}

.popup-box button {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-weight: 600;
    background: linear-gradient(90deg, #3498db, #2ecc71);
    color: #fff;
}

/* ================= HEADER ================= */
.header {
    text-align: center;
    margin-bottom: 60px;
}

.logo {
    font-size: clamp(2.5rem, 8vw, 3.5rem);
    font-weight: 800;
}

.logo span:first-child {
    background: linear-gradient(to right, #3ab5f0, #3498db);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.logo span:last-child {
    background: linear-gradient(to right, #2ecc71, #a8e063);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.subtitle {
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 2px;
    font-size: 0.9rem;
}

/* ================= CARDS ================= */
.card-container {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
}

.card {
    background: var(--card-bg);
    border: 1px solid var(--border-default);
    border-radius: 15px;
    padding: 50px 20px;
    text-align: center;
    cursor: pointer;
    transition: 0.3s;
}

.card:hover {
    background: rgba(255,255,255,0.06);
    transform: translateY(-8px);
}

.card.active {
    border-color: var(--border-active);
}

.icon svg {
    width: 45px;
    height: 45px;
    stroke: var(--accent-blue);
}

.card h2 { margin: 15px 0 8px; }
.card p { color: var(--text-muted); }

@media (max-width: 600px) {
    .card-container { grid-template-columns: 1fr; }
    .header { margin-bottom: 30px; }
}
</style>
</head>

<body>

<!-- LOADER -->
<div id="pageLoader">
    <div class="loader-text">SATVERSE</div>
</div>

<!-- NAME POPUP -->
<div id="namePopup">
    <div class="popup-box">
        <h2>Welcome</h2>
        <p>Enter your player name</p>
        <input type="text" id="playerNameInput" placeholder="Player name">
        <button onclick="savePlayerName()">Continue</button>
    </div>
</div>

<!-- MAIN UI -->
<div class="header">
    <h1 class="logo"><span>Cricket</span> <span>Clash</span></h1>
    <p class="subtitle">Strategy Arena</p>
</div>

<div class="card-container">
    <div class="card" onclick="selectCard(this)">
        <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"/></svg>
        </div>
        <h2>Single Player</h2>
        <p>VS Computer</p>
    </div>

    <div class="card" onclick="selectCard(this)">
        <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><line x1="4" y1="4" x2="20" y2="20"/><line x1="20" y1="4" x2="4" y2="20"/></svg>
        </div>
        <h2>1v1 Battle</h2>
        <p>Private Challenge</p>
    </div>

    <div class="card" onclick="selectCard(this)">
        <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><circle cx="9" cy="7" r="4"/><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/></svg>
        </div>
        <h2>Multiplayer</h2>
        <p>Online Match</p>
    </div>

    <div class="card" onclick="window.location.href='tournament.html'">
        <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M6 3h12v18H6z"/></svg>
        </div>
        <h2>Tournaments</h2>
        <p>It is the war</p>
    </div>
</div>

<script>
function selectCard(el){
    document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));
    el.classList.add('active');
}

/* LOADER + NAME CHECK */
window.addEventListener("load", () => {
    setTimeout(() => {
        document.getElementById("pageLoader").remove();

        if (!localStorage.getItem("playerName")) {
            document.getElementById("namePopup").style.display = "flex";
        }
    }, 600);
});

function savePlayerName(){
    const name = document.getElementById("playerNameInput").value.trim();
    if(!name) return;
    localStorage.setItem("playerName", name);
    document.getElementById("namePopup").style.display = "none";
}
</script>

</body>
</html>
